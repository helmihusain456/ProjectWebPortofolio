<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Profil Anggota</title>
    <link rel="stylesheet" href="about.css">
    <script src="about.js" defer></script>
</head>
<body>
    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container result-container">
        <section class="intro">
            <h1>Profil Berhasil Dikirim!</h1>
            <p>Berikut adalah informasi anggota yang telah kamu masukkan.</p>
        </section>

        <section class="card result-card">
            <img id="resultPhoto" src="https://placehold.co/400x300?text=No+Photo" alt="Foto anggota">
            <div class="result-details">
                <h2 id="resultName"></h2>
                <span id="resultRole"></span>
                <p><strong>Email:</strong> <span id="resultEmail"></span></p>
                <p><strong>Nomor telepon:</strong> <span id="resultPhone"></span></p>
                <p><strong>Keahlian:</strong> <span id="resultSkill"></span></p>
                <p><strong>Deskripsi diri:</strong></p>
                <p id="resultBio"></p>
            </div>
            <a class="back-link" href="about.html">Kembali ke halaman utama</a>
        </section>
