<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Kami</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="content">
        <h1>Contact Kami</h1>
        <p class="intro">Kami bekerja sama untuk menciptakan solusi inovatif.</p>

        <form id="contact-we">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input id="nama" name="nama" type="text"
                       placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email"
                       placeholder="contoh@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="nomor-whatsapp">Nomor WhatsApp</label>
                <input id="nomor-whatsapp" name="whatsapp" type="tel"
                       placeholder="Contoh: 081234567890" required>
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="4"
                          placeholder="Tulis pesan Anda di sini..." required></textarea>
            </div>

            <p id="status-form" aria-live="polite"></p>
            <button type="submit">Kirim</button>
        </form>
    </main>

    <script src="contact.js"></script>
</body>
</html>
